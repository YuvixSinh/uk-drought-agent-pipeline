<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Agronomist — UK Water Balance &amp; Seasonal Horizon</title>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
</head>
<body>
  <!-- Persistent 3D WebGL Globe Layer (transforms seamlessly across #place, #analysis, #outlook) -->
  <div id="globe-persistent-layer" class="mode-place">
    <div id="globe-mount"></div>
  </div>

  <!-- 3-Page Horizontal Parallax Viewport -->
  <div id="app-viewport">
    <main id="pages-track">
      <section id="page-place" class="page-screen" aria-label="Place selection screen"></section>
      <section id="page-analysis" class="page-screen" aria-label="Analysis wheel screen"></section>
      <section id="page-outlook" class="page-screen" aria-label="Three-question outlook screen"></section>
    </main>
  </div>

  <!-- Edge Navigation Chevrons -->
  <button type="button" id="chevron-left" class="edge-chevron left interactive" aria-label="Previous page">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="12 4 6 10 12 16"></polyline>
    </svg>
  </button>
  <button type="button" id="chevron-right" class="edge-chevron right interactive" aria-label="Next page">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="8 4 14 10 8 16"></polyline>
    </svg>
  </button>

  <!-- Persistent Bottom-Centre Pager -->
  <nav id="global-pager" aria-label="Page navigation"></nav>

  <!-- Sliding Right-Hand Details Drawer -->
  <aside id="details-drawer" aria-label="Inspection details drawer"></aside>

  <!-- Global Provenance & Metric Hover Tooltip -->
  <div id="global-tooltip" role="tooltip"></div>

  <!-- Vendored Offline-Safe Libraries (Zero Runtime CDN) -->
  <script src="/vendor/globe.gl.min.js"></script>
  <script src="/vendor/gsap.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
